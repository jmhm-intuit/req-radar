<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14274c" />
    <meta name="description" content="ReqRadar combines evidence-backed career fit with adaptive, job-specific scenario reflection to help applicants understand and prioritize opportunities." />
    <title>ReqRadar v3.0.1 — Fit Discovery Studio</title>
    <style>
      #boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fb;color:#23324d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
      #boot-fallback>div{width:min(420px,100%);padding:28px;border:1px solid #dce3ee;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(35,50,77,.12)}
      #boot-fallback b{display:inline-grid;place-items:center;width:52px;height:52px;margin-bottom:14px;border-radius:15px;color:#fff;background:#294a8a;font-size:17px}
      #boot-fallback strong{display:block;margin-bottom:7px;font-size:18px}
      #boot-fallback span{display:block;color:#6d7a91;font-size:13px;line-height:1.5}
      #boot-fallback i{display:block;width:160px;height:5px;margin:18px auto 0;overflow:hidden;border-radius:999px;background:#e7ebf3}
      #boot-fallback i:after{content:"";display:block;width:55%;height:100%;border-radius:inherit;background:#5472d2;animation:reqradar-load 1.15s ease-in-out infinite alternate}
      @keyframes reqradar-load{from{transform:translateX(-70%)}to{transform:translateX(150%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" role="status" aria-live="polite">
        <div><b>RR</b><strong>Starting ReqRadar</strong><span id="boot-message">Loading your local career portfolio…</span><i></i></div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById("boot-fallback");
        var message = document.getElementById("boot-message");
        if (fallback && message) message.textContent = "Startup is taking longer than expected. Refresh once; if it persists, ReqRadar will show recovery options instead of a blank screen.";
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
