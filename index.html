<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<meta name="description" content="Questline 4.2 is a local-first mobile planner with movable Tasks, a trustworthy life-area Review, automatic period history, and an explainable priority queue.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Questline v4.2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#page">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <button class="brand" data-view="today" aria-label="Go to Today">
      <img src="assets/brand.webp" alt="Questline">
      <span><strong>Questline</strong><small>Live your quest</small><b class="version-pill" data-version>v4.2.0</b></span>
    </button>
    <nav id="desktop-nav"></nav>
    <div class="sidebar-footer">
      <span>Local-first · Offline-capable</span>
      <strong data-version-long>Questline v4.2.0</strong>
    </div>
  </aside>

  <main class="main" id="page" tabindex="-1">
    <header class="topbar">
      <div class="page-heading">
        <img id="page-icon" src="assets/scene_today.webp" alt="">
        <div><span class="eyebrow" id="page-eyebrow">PLAN</span><h1 id="page-title">Today</h1></div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="global-search" aria-label="Search">⌕</button>
        <button class="icon-button" id="menu-button" aria-label="Open menu">☰</button>
        <button class="button primary" id="header-add"><span>＋</span><span class="button-label">Add</span></button>
      </div>
    </header>
    <section id="view-root" aria-live="polite"></section>
  </main>
</div>

<nav class="mobile-nav" id="mobile-nav" aria-label="Primary mobile navigation"></nav>
<button class="fab" id="mobile-add" aria-label="Add">＋</button>
<div class="modal-root" id="modal-root"></div>
<div class="drawer-root" id="drawer-root"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>
<input id="file-import" type="file" hidden accept=".json,.xlsx,.ics,text/calendar,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<script src="vendor/jszip.min.js"></script>
<script src="vendor/questline-xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
